[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflow-analysis"
dynamic = ["version"]
description = "A static analysis framework for Python"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "rainoftime", email = "rainoftime@gmail.com"}
]
maintainers = [
    {name = "rainoftime", email = "rainoftime@gmail.com"}
]
keywords = ["python", "compiler", "static-analysis", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "asciitree",
    "graphviz",
    "networkx",
    "packaging",
    "rstr",
    "typing_inspect"
]

[project.optional-dependencies]
dev = [
    "z3-solver",
    "pytest>=6.0",
    "pytest-cov",
    "pytest-timeout>=2.3",
    "black",
    "flake8",
    "mypy",
    "tomli; python_version < '3.11'"
]
# a3-python is a standalone third-party package at third-party/a3_python/.
# Install it separately: pip install -e third-party/a3_python
test = [
    "z3-solver",
    "pytest>=6.0",
    "pytest-cov",
    "pytest-timeout>=2.3",
    "tomli; python_version < '3.11'",
]
callgraph = [
    "pycg==0.0.6",
]
concolic = [
    "z3-solver",
]
supply-chain = [
    "jsonschema>=4.18",
    "sigstore>=3",
]

[project.scripts]
pyflow = "pyflow.cli.main:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pyflow.__version__"}

[tool.setuptools.package-data]
pyflow = ["lib/**/*", "stubs/**/*", "config/**/*", "analysis/alias/kcfa/_pythonstan/stubs/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test*"]
norecursedirs = ["tests/full"]
markers = [
    "integration: integration tests (CLI, full pipeline); run with -m integration",
    "slow: slow-running tests excluded from the default fast path by convention",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-m",
    "not integration",
    #"-W", "ignore::DeprecationWarning",
    "-W",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]
timeout = 120
timeout_method = "thread"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | third-party
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "antlr3.*",
    "PADS.*",
    "pydot",
]
ignore_missing_imports = true
