name: PyFlow CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Check tooling files with black
        run: |
          black --check tests/tooling

      - name: Lint tooling files with flake8
        run: |
          flake8 tests/tooling

      - name: Run tooling tests
        run: |
          pytest tests/tooling -q

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            graphviz \
            build-essential

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install graphviz

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install graphviz -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest --cov=pyflow --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  supply-chain-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install supply-chain tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,supply-chain]"

      - name: Run supply-chain security tests
        run: pytest -q tests/checker/supply_chain tests/cli/test_supply_chain.py

      - name: Fetch pinned official SBOM schemas
        run: |
          curl --fail --silent --show-error \
            https://cyclonedx.org/schema/bom-1.7.schema.json \
            --output /tmp/cyclonedx-1.7.schema.json
          curl --fail --silent --show-error \
            https://cyclonedx.org/schema/spdx.schema.json \
            --output /tmp/spdx.schema.json
          curl --fail --silent --show-error \
            https://cyclonedx.org/schema/jsf-0.82.schema.json \
            --output /tmp/jsf-0.82.schema.json
          curl --fail --silent --show-error \
            https://cyclonedx.org/schema/cryptography-defs.schema.json \
            --output /tmp/cryptography-defs.schema.json
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json \
            --output /tmp/spdx-2.3.schema.json

      - name: Validate generated SBOMs against official schemas
        run: |
          pyflow supply-chain sbom pyproject.toml --format cyclonedx-json \
            --schema /tmp/cyclonedx-1.7.schema.json --require-schema-validation \
            --allow-incomplete --output /tmp/pyflow.cdx.json
          pyflow supply-chain sbom pyproject.toml --format spdx-json \
            --schema /tmp/spdx-2.3.schema.json --require-schema-validation \
            --allow-incomplete --output /tmp/pyflow.spdx.json

      - name: Check real Sigstore verifier installation
        run: sigstore --version

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e ".[dev]"

      - name: Validate build metadata
        run: |
          python -m build

  check-docs-changes:
    runs-on: ubuntu-latest
    outputs:
      docs-changed: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for docs changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - "docs/source/**"
              - "docs/requirements.txt"
              - "docs/Makefile"

  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz make

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          cd docs && make html

  docs-deploy:
    runs-on: ubuntu-latest
    needs: [docs-check, check-docs-changes]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      needs.check-docs-changes.outputs.docs-changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz make

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          cd docs && make html

      - name: Deploy documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
